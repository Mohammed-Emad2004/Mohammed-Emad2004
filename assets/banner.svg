<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="50%" stop-color="#0d1b26"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="198" fill="none" stroke="#134e5e" stroke-width="1" opacity="0.5"/>

  <!-- LEFT CIRCUIT -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.55">
    <path id="lp1" d="M0,40 H90 L120,70 H220 L245,95"/>
    <path id="lp2" d="M0,90 H60 L85,115 H180"/>
    <path id="lp3" d="M0,140 H130 L160,110 H260 L280,90"/>
    <path id="lp4" d="M30,20 V60 H150 L175,85"/>
  </g>
  <g fill="#67e8f9" opacity="0.9">
    <circle cx="90" cy="40" r="4"/>
    <circle cx="220" cy="70" r="4"/>
    <circle cx="245" cy="95" r="3"/>
    <circle cx="60" cy="90" r="3.5"/>
    <circle cx="180" cy="115" r="3.5"/>
    <circle cx="130" cy="140" r="4"/>
    <circle cx="260" cy="110" r="3.5"/>
    <circle cx="30" cy="20" r="3"/>
    <circle cx="150" cy="60" r="3.5"/>
  </g>
  <!-- traveling pulses (left) -->
  <circle r="3.2" fill="#a5f3fc" filter="url(#softGlow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M0,40 H90 L120,70 H220 L245,95"/>
  </circle>
  <circle r="3.2" fill="#a5f3fc" filter="url(#softGlow)">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M0,140 H130 L160,110 H260 L280,90"/>
  </circle>
  <circle r="2.8" fill="#a5f3fc" filter="url(#softGlow)">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M30,20 V60 H150 L175,85"/>
  </circle>

  <!-- RIGHT CIRCUIT (mirrored) -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.55">
    <path d="M1200,40 H1110 L1080,70 H980 L955,95"/>
    <path d="M1200,90 H1140 L1115,115 H1020"/>
    <path d="M1200,140 H1070 L1040,110 H940 L920,90"/>
    <path d="M1170,20 V60 H1050 L1025,85"/>
  </g>
  <g fill="#67e8f9" opacity="0.9">
    <circle cx="1110" cy="40" r="4"/>
    <circle cx="980" cy="70" r="4"/>
    <circle cx="955" cy="95" r="3"/>
    <circle cx="1140" cy="90" r="3.5"/>
    <circle cx="1020" cy="115" r="3.5"/>
    <circle cx="1070" cy="140" r="4"/>
    <circle cx="940" cy="110" r="3.5"/>
    <circle cx="1170" cy="20" r="3"/>
    <circle cx="1050" cy="60" r="3.5"/>
  </g>
  <circle r="3.2" fill="#a5f3fc" filter="url(#softGlow)">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M1200,40 H1110 L1080,70 H980 L955,95"/>
  </circle>
  <circle r="3.2" fill="#a5f3fc" filter="url(#softGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M1200,140 H1070 L1040,110 H940 L920,90"/>
  </circle>
  <circle r="2.8" fill="#a5f3fc" filter="url(#softGlow)">
    <animateMotion dur="3.8s" repeatCount="indefinite" path="M1170,20 V60 H1050 L1025,85"/>
  </circle>

  <!-- CENTER TEXT -->
  <text x="600" y="95" text-anchor="middle" font-family="Verdana, Segoe UI, sans-serif" font-weight="bold"
        font-size="46" fill="#22d3ee" filter="url(#glow)">
    Mohammed Emad Hamdy
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="130" text-anchor="middle" font-family="Verdana, Segoe UI, sans-serif"
        font-size="17" fill="#e5f9ff" opacity="0.9">
    Data Engineer | AI Developer | Data Analytics
  </text>
</svg>
